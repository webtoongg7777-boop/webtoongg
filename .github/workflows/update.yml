# 웹툰지지 자동 갱신 + GitHub Pages 배포
# - 하루 4번(한국시간 새벽 3시 · 오전 9시 · 오후 3시 · 밤 9시): 플랫폼 인기 순위 갱신 → 추천 페이지 재생성 → 사이트 배포
# - 매주 월 · 목요일 새벽 2시(한국시간): 작품 정보 전체(네이버 · 카카오 · 레진)도 함께 갱신
#   (전체 갱신은 약 40분 걸리고 플랫폼에 요청을 많이 보내서 주 2번만 해요)
# - GitHub 예약 실행은 붐비는 시간엔 10~30분쯤 늦게 시작될 수 있어요
# - main 에 수정 사항을 올리면(Push) 바로 배포돼요
# - GitHub 저장소의 Actions 탭 → "웹툰지지 자동 갱신" → Run workflow 로 직접 실행할 수도 있어요
#
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 해요.

name: 웹툰지지 자동 갱신

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 매일 00·06·12·18시 UTC = 한국시간 오전 9시 · 오후 3시 · 밤 9시 · 새벽 3시 (순위)
    - cron: "0 17 * * 0,3"        # 매주 일 · 수요일 17:00 UTC = 한국시간 월 · 목요일 새벽 2시 (작품 정보 전체)
  push:
    branches: [main]
    paths-ignore:          # 자동 갱신이 저장한 데이터 때문에 다시 실행되지 않게 (봇 저장은 [skip ci] 로도 막아요)
      - "data-*.js"
      - "thumbs/**"
      - "recommend/**"
      - "similar/**"
      - "sitemap.xml"
      - "rss.xml"
  workflow_dispatch:
    inputs:
      full:
        description: "작품 정보 전체도 갱신할까요? (약 40분)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest     # 기존 PowerShell 스크립트를 그대로 쓰려고 윈도우에서 실행해요
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 작품 정보 전체 갱신 (주 2회)
        if: github.event.schedule == '0 17 * * 0,3' || inputs.full
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\fetch-naver.ps1
          powershell -ExecutionPolicy Bypass -File .\fetch-kakao.ps1
          powershell -ExecutionPolicy Bypass -File .\fetch-lezhin.ps1

      - name: 인기 순위 갱신
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\fetch-ranking.ps1

      - name: 올릴 파일 준비 (추천 페이지 · 사이트맵 재생성)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\stage-site.ps1

      - name: 바뀐 데이터를 저장소에 저장
        shell: bash
        run: |
          git config user.name "webtoongg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data-*.js thumbs recommend similar sitemap.xml rss.xml index.html
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "자동 갱신: $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: 사이트 파일 넘겨주기
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _deploy
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest      # GitHub Pages 배포는 리눅스에서 해요
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _deploy

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
